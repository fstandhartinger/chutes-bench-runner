services:
  worker:
    image: chutes-bench-runner-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.worker
    cpus: ${WORKER_CONTAINER_CPU_LIMIT:-2.0}
    mem_limit: ${WORKER_CONTAINER_MEM_LIMIT:-8g}
    memswap_limit: ${WORKER_CONTAINER_MEMSWAP_LIMIT:-8g}
    pids_limit: ${WORKER_CONTAINER_PIDS_LIMIT:-768}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/lib/sandy/cache:/var/lib/sandy/cache
      - /var/lib/sandy/cache/chutes-bench-data:/var/lib/sandy/cache/chutes-bench-data
    command: python -m app.worker.runner
    restart: unless-stopped
    # Surfaces a wedged main loop in `docker ps` even if the in-process watchdog
    # itself were to fail. The watchdog rewrites this file on every loop tick.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/worker-watchdog-heartbeat &&
          test $(( $(date +%s) - $(cut -d' ' -f1 /tmp/worker-watchdog-heartbeat) ))
          -lt ${WORKER_WATCHDOG_TIMEOUT_SECONDS:-600}
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
